<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pricing Plans</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f5f7fb;
    margin:0;
    padding:40px;
}

.pricing-section{
    text-align:center;
}

.pricing-container{
    display:flex;
    justify-content:center;
    gap:30px;
    flex-wrap:wrap;
    margin-top:30px;
}

.card{
    background:white;
    width:280px;
    padding:30px;
    border-radius:12px;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
    transition: all 0.3s ease;
}

.card:hover{
    transform: translateY(-10px) scale(1.03);
    box-shadow:0 15px 35px rgba(0,0,0,0.15);
}

.card h2{
    margin-bottom:10px;
}

.price{
    font-size:32px;
    font-weight:bold;
    margin:15px 0;
}

.features{
    list-style:none;
    padding:0;
    margin:20px 0;
}

.features li{
    margin:10px 0;
    color:#555;
}

button{
    background:#4CAF50;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:6px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#45a049;
}


.featured{
    border:3px solid #4CAF50;
    transform: scale(1.05);
}

.featured .price{
    color:#4CAF50;
}

</style>
</head>

<body>

<section class="pricing-section">

<h1>Our Pricing Plans</h1>

<div class="pricing-container">

<div class="card">
<h2>Basic</h2>
<p class="price">$9/mo</p>

<ul class="features">
<li>1 Website</li>
<li>10 GB Storage</li>
<li>Email Support</li>
<li>Basic Analytics</li>
</ul>

<button>Subscribe</button>
</div>


<div class="card featured">
<h2>Standard</h2>
<p class="price">$19/mo</p>

<ul class="features">
<li>5 Websites</li>
<li>50 GB Storage</li>
<li>Priority Support</li>
<li>Advanced Analytics</li>
</ul>

<button>Subscribe</button>
</div>


<div class="card">
<h2>Premium</h2>
<p class="price">$39/mo</p>

<ul class="features">
<li>Unlimited Websites</li>
<li>200 GB Storage</li>
<li>24/7 Support</li>
<li>Full Analytics</li>
</ul>

<button>Subscribe</button>
</div>

</div>

</section>

</body>
</html>
