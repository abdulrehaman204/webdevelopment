<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            margin: 0;
        }
        .container{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px ;
            background-color: gray;
        }
        .Logo{
            color: white;
            font-size: 22px;
            font-weight: bold;
        }
        .menu{
            display: flex;
            gap: 20px;
        }
        .menu a{
            color: white;
            font-size: 16px;
            text-decoration: none;
        }
        .menu a:hover{
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <nav class="container">
    <div class="Logo">Logo</div>
    <div class="menu">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </div>
    </nav>
</body>
</html>
