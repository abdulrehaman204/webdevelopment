<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header, footer{
           background: #333;
           color: white;
           padding: 15px;
        }
        .main{
            display: flex;
            flex: 1;
        }
        aside{
            width: 200px;
            background: #ddd;
        }
        section{
            flex: 1;
            padding: 20px;
        }
    </style>
</head>
<body>
    <header>Header</header>
    <div class="main">
        <aside>Sidebar</aside>
        <section>Content</section>
    </div>
    <footer>Footer</footer>
</body>
</html>
