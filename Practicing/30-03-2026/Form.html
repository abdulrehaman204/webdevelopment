<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Registration Form</h1>
    <form style="border: 3; border-color: solid black;">
        <label for="Full Name">Full Name:</label><br>
        <input type="text" id="Full Name" class="Full Name" placeholder="Enter your name" required size="20px"><br><br>
        <label for="email">Email:</label><br>
        <input type="email" id="email" placeholder="email" ><br><br>
        <label for="Password">Password:</label><br>
        <input type="password" minlength="8" required id="Password" placeholder="enter password"><br><br>
        <label>Gender:</label><br>
        <input type="radio" id="male" name="gender" value="male" required>
        <label for="male">Male</label><br>
        <input type="radio" id="female" name="gender" value="female" required>
        <label for="female">Feamale</label><br>
        <input type="radio" id="other" name="gender" value="other" required>
        <label for="other">Other</label><br><br>
        <label for="country">Country:</label>
        <select id="country" name="country" required>
        <option value="">select your country</option>
        <option value="USA">USA</option>
        <option value="Australia">Australia</option>
        <option value="India">India</option>
        <option value="Canada">Canada</option>
        </select><br><br>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
