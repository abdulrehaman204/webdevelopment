<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Cards</title>
    <style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f4f4;
    padding:40px;
}

.pricing{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.card{
    background:white;
    padding:25px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 0 10px rgba(0,0,0,.2);
    transition:.3s;
}

.card:hover{
    transform:translateY(-8px);
}

.card h1{
    color:#2196f3;
    margin:20px 0;
}

.card ul{
    list-style:none;
    margin:20px 0;
}

.card li{
    padding:10px;
    border-bottom:1px solid #ddd;
}

button{
    padding:10px 20px;
    border:none;
    background:#2196f3;
    color:white;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#1565c0;
}

/* Tablet */

@media(max-width:992px){
.pricing{
grid-template-columns:repeat(2,1fr);
}
}

/* Mobile */

@media(max-width:576px){
.pricing{
grid-template-columns:1fr;
}
}
    </style>
</head>
<body>

<section class="pricing">

    <div class="card">
        <h2>Basic</h2>
        <h1>$10</h1>

        <ul>
            <li>1 Website</li>
            <li>5 GB Storage</li>
            <li>Email Support</li>
        </ul>

        <button>Subscribe</button>
    </div>

    <div class="card">
        <h2>Pro</h2>
        <h1>$20</h1>

        <ul>
            <li>5 Websites</li>
            <li>50 GB Storage</li>
            <li>Priority Support</li>
        </ul>

        <button>Subscribe</button>
    </div>

    <div class="card">
        <h2>Premium</h2>
        <h1>$40</h1>

        <ul>
            <li>Unlimited Websites</li>
            <li>200 GB Storage</li>
            <li>24/7 Support</li>
        </ul>

        <button>Subscribe</button>
    </div>

</section>

</body>
</html>
