<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hero Section</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

.hero{
  height:100vh;
  background:url("https://picsum.photos/id/1018/1600/900") center/cover no-repeat;
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  color:#fff;
}

.hero::before{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.5);
}

.content{
  position:relative;
  z-index:1;
  padding:20px;
}

.content h1{
  font-size:60px;
  margin-bottom:20px;
}

.content button{
  padding:12px 30px;
  border:none;
  background:#ff6600;
  color:#fff;
  font-size:18px;
  border-radius:5px;
  cursor:pointer;
  transition:.3s;
}

.content button:hover{
  background:#e65c00;
}

/* Responsive */
@media(max-width:768px){
  .content h1{
    font-size:38px;
  }

  .content button{
    width:100%;
  }
}
</style>
</head>

<body>

<section class="hero">
  
  <div class="content">
    <h1>Welcome To Our Website</h1>
    <button>Get Started</button>
  </div>

</section>

</body>
</html>
