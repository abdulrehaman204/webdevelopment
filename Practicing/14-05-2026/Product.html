<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Listing</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
}

body{
  background:#f5f5f5;
}

/* Layout */
.container{
  display:flex;
  gap:20px;
  padding:20px;
}

/* Sidebar */
.sidebar{
  width:250px;
  background:#fff;
  padding:20px;
  border-radius:10px;
}

.sidebar h3{
  margin-bottom:10px;
}

.sidebar label{
  display:block;
  margin:8px 0;
}

.sidebar input{
  width:100%;
  padding:8px;
  margin-top:5px;
}

/* Products */
.products{
  flex:1;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;
}

.card{
  background:#fff;
  padding:15px;
  border-radius:10px;
  transition:.3s;
  text-align:center;
}

.card:hover{
  transform:translateY(-5px);
  box-shadow:0 5px 15px rgba(0,0,0,.2);
}

.card img{
  width:100%;
  height:180px;
  object-fit:cover;
  border-radius:8px;
}

.price{
  color:green;
  font-weight:bold;
  margin:8px 0;
}

.rating{
  color:orange;
}

button{
  background:#111;
  color:#fff;
  border:none;
  padding:10px;
  width:100%;
  border-radius:5px;
  cursor:pointer;
  margin-top:10px;
}

button:hover{
  background:#444;
}

/* Sidebar Toggle */
.toggle{
  display:none;
  margin:10px;
  padding:10px;
  background:#111;
  color:#fff;
  border:none;
}

/* Tablet */
@media(max-width:992px){
  .products{
    grid-template-columns:repeat(2,1fr);
  }

  .sidebar{
    display:none;
    position:absolute;
    top:60px;
    left:10px;
    z-index:10;
  }

  .sidebar.show{
    display:block;
  }

  .toggle{
    display:block;
  }
}

/* Mobile */
@media(max-width:600px){
  .products{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<button class="toggle">☰ Filters</button>

<div class="container">

  <!-- Sidebar -->
  <div class="sidebar">
    <h3>Category</h3>

    <label><input type="checkbox" value="Shoes" class="cat"> Shoes</label>
    <label><input type="checkbox" value="Watch" class="cat"> Watch</label>
    <label><input type="checkbox" value="Bag" class="cat"> Bag</label>

    <h3 style="margin-top:20px;">Price Range</h3>

    <input type="number" id="min" placeholder="Min Price">
    <input type="number" id="max" placeholder="Max Price">
  </div>

  <!-- Products -->
  <div class="products" id="products"></div>

</div>

<script>
const products=[
{title:"Running Shoes",price:50,cat:"Shoes",img:"https://picsum.photos/200?1"},
{title:"Leather Bag",price:80,cat:"Bag",img:"https://picsum.photos/200?2"},
{title:"Smart Watch",price:120,cat:"Watch",img:"https://picsum.photos/200?3"},
{title:"Sneakers",price:70,cat:"Shoes",img:"https://picsum.photos/200?4"},
{title:"Travel Bag",price:90,cat:"Bag",img:"https://picsum.photos/200?5"},
{title:"Classic Watch",price:150,cat:"Watch",img:"https://picsum.photos/200?6"},
{title:"Sports Shoes",price:60,cat:"Shoes",img:"https://picsum.photos/200?7"},
{title:"Laptop Bag",price:100,cat:"Bag",img:"https://picsum.photos/200?8"},
{title:"Digital Watch",price:110,cat:"Watch",img:"https://picsum.photos/200?9"},
{title:"Casual Shoes",price:55,cat:"Shoes",img:"https://picsum.photos/200?10"},
];

const productBox=document.getElementById("products");

function display(data){
  productBox.innerHTML=data.map(p=>`
    <div class="card">
      <img src="${p.img}">
      <h4>${p.title}</h4>
      <div class="price">$${p.price}</div>
      <div class="rating">★★★★☆</div>
      <button>Add to Cart</button>
    </div>
  `).join("");
}

display(products);

/* Filter */
document.querySelectorAll(".cat,#min,#max").forEach(el=>{
  el.addEventListener("input",filterProducts);
});

function filterProducts(){

  let checked=[...document.querySelectorAll(".cat:checked")]
  .map(c=>c.value);

  let min=document.getElementById("min").value || 0;
  let max=document.getElementById("max").value || Infinity;

  let filtered=products.filter(p=>
    (checked.length==0 || checked.includes(p.cat)) &&
    p.price>=min &&
    p.price<=max
  );

  display(filtered);
}

/* Sidebar Toggle */
const toggle=document.querySelector(".toggle");
const sidebar=document.querySelector(".sidebar");

toggle.onclick=()=>{
  sidebar.classList.toggle("show");
};
</script>

</body>
</html>
