<!DOCTYPE html>
<html>
<head>
<style>
body{
  background:#111;
  margin:0;
  padding:20px;
  font-family:Arial;
}

h1{
    color: white;
    text-align: center;
}

.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,2fr));
  gap:15px;
}

.gallery img{
  width:100%;
  height:200px;
  object-fit:cover;
  cursor:pointer;
  border-radius:10px;
  transition:.4s;
}

.gallery img:hover{
  transform:scale(1.08);
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.9);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal img{
  width:70%;
  max-height:80vh;
  border-radius:10px;
}

.btn{
  position:absolute;
  color:#fff;
  font-size:40px;
  cursor:pointer;
  user-select:none;
}

.close{top:20px;right:30px;}
.prev{left:30px;}
.next{right:30px;}
</style>
</head>

<body>

<h1>Advanced image gallery</h1>

<div class="gallery">
  <img src="https://picsum.photos/id/1015/500/300">
  <img src="https://picsum.photos/id/1016/500/300">
  <img src="https://picsum.photos/id/1025/500/300">
  <img src="https://picsum.photos/id/1035/500/300">
  <img src="https://picsum.photos/id/1043/500/300">
  <img src="https://picsum.photos/id/1050/500/300">
  <img src="https://picsum.photos/id/1062/500/300">
  <img src="https://picsum.photos/id/1074/500/300">
</div>

<div class="modal" id="modal">
  <span class="btn close">&times;</span>
  <span class="btn prev">&#10094;</span>
  <img id="modalImg">
  <span class="btn next">&#10095;</span>
</div>

<script>
let imgs=document.querySelectorAll(".gallery img"),
modal=document.getElementById("modal"),
modalImg=document.getElementById("modalImg"),
i=0;

imgs.forEach((img,index)=>{
  img.onclick=()=>{
    i=index;
    show();
  };
});

function show(){
  modal.style.display="flex";
  modalImg.src=imgs[i].src;
}

document.querySelector(".close").onclick=()=>{
  modal.style.display="none";
};

document.querySelector(".next").onclick=()=>{
  i=(i+1)%imgs.length;
  show();
};

document.querySelector(".prev").onclick=()=>{
  i=(i-1+imgs.length)%imgs.length;
  show();
};

window.onclick=e=>{
  if(e.target==modal) modal.style.display="none";
};

document.onkeydown=e=>{
  if(e.key=="Escape") modal.style.display="none";
};

</script>

</body>
</html>
