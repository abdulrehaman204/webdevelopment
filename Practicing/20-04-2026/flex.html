<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
.navbar{
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #333;
    color: white;
    padding: 15px 20px;
}
.navbar ul {
    display: flex;
    list-style: none;
    gap: 20px;
}

.navbar ul li {
    cursor: pointer;
}

.navbar ul li:hover {
    color: yellow;
}
    </style>
</head>
<body>
    <div class="navbar">
        <h2>Logo</h2>
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Services</li>
            <li>Contact</li>
        </ul>
    </div>
</body>
</html>
