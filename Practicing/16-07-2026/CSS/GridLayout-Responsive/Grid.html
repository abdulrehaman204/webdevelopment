<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Grid-Layout</title>
    <style>
    *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
    }
    .container{
        display: grid;
        grid-template-columns: 250px 1fr;
        grid-template-areas: 
        "header header"
        "sidebar main"
        "footer footer";
        min-height: 100vh;
    }
    header{
        grid-area: header;
        background-color:  #4CAF50;
        color: white;
        padding: 20px;
        text-align: center;
    }
    aside{
        grid-area: sidebar;
        background-color:  #f4f4f4;
        padding: 20px;
    }
    main{
        grid-area: main;
        background-color:  #fff;
        padding: 20px;
    }
    footer{
        grid-area: footer;
        background-color: #333;
        color: white;
        padding: 15px;
        text-align: center;
    }
    /* media quaries */
    @media(max-width : 768px){
        .container{
            grid-template-columns: 1fr;
            grid-template-areas:
            "header"
            "sidebar"
            "main"
            "footer";
        }
    }
    </style>
</head>
<body>
    <div class="container">
  <header>Header</header>
  <aside>Sidebar</aside>
  <main>Main Content</main>
  <footer>Footer</footer>
    </div>
</body>
</html>
