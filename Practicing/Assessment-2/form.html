<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            background-color: whitesmoke;
            text-align: center;
            border: 2px solid black;
            border-width: auto;
            width: 800px;
        }

    </style>
</head>
<body>
    <div>
        <h1>Contact Form </h1>
        <form>
            <label for="name">FullName : </label><br>
            <input type="text" placeholder="enter your fullname" required id="name"/><br><br>
             <label for="email">Email Address : </label><br>
            <input type="email" placeholder="enter your Email" required id="email"/><br><br>
             <label for="number">Phone Number : </label><br>
            <input type="number" placeholder="enter your phone number" required id="number" maxlength="10" minlength="0"/><br><br>
             <label for="message">Message : </label><br>
            <input type="text" placeholder="enter a message " required id="message" min="10"/><br><br>
            <button>Submit</button> <br><br>
        </form>
    </div>
</body>
</html>
