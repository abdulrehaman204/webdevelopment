<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid-Layout</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container{
            min-height: 100vh;
            display: grid;
            grid-template-columns: 250px 1fr;
            grid-template-rows: 80px 1fr 70px;
            grid-template-areas: 
            "header header"
            "sidebar content"
            "footer footer";
        }
        .header{
    grid-area:header;
    background:#2563eb;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
}     
.sidebar{
    grid-area:sidebar;
    background:#e5e7eb;
    padding:20px;
}

.content{
    grid-area:content;
    padding:20px;
    background:#f8fafc;
}

.footer{
    grid-area:footer;
    background:#1f2937;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
}                                
    </style>
</head>
<body>
    <div class="container">
    <header class="header">Header</header>
    <aside class="sidebar">Sidebar</aside>
    <main class="content">Main Content</main>
    <footer class="footer"> Footer</footer>
</div>
</body>
</html>
