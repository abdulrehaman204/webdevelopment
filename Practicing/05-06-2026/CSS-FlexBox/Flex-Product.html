<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
    <style>
   *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f4f4;
    padding:30px;
}

.products-container{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    justify-content:center;
}

.product-card{
    background:#fff;
    width:calc(25% - 20px);
    min-width:250px;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
    transition:0.3s;
}

.product-card:hover{
    transform:translateY(-8px);
    box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

.product-card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.product-card h3{
    padding:15px 15px 5px;
}

.price{
    color:#28a745;
    font-size:20px;
    font-weight:bold;
    padding:0 15px;
}

.rating{
    padding:10px 15px;
    color:#ff9800;
}

.product-card button{
    width:calc(100% - 30px);
    margin:15px;
    padding:12px;
    border:none;
    border-radius:6px;
    background:#007bff;
    color:white;
    cursor:pointer;
    transition:0.3s;
}

.product-card button:hover{
    background:#0056b3;
}

/* Tablet */

@media(max-width:992px){

    .product-card{
        width:calc(50% - 20px);
    }
}

/* Mobile */

@media(max-width:600px){

    .product-card{
        width:100%;
    }
}
    </style>
</head>
<body>
    <div clas="products-container">
        <div class="product-card">
        <img src="https://picsum.photos/250?1" alt="Product">
        <h2>Laptop</h2>
        <p class="price">$899</p>
        <div class="rating">⭐⭐⭐⭐⭐</div>
        <button>Buy Now</button>
        </div>

    <div class="product-card">
        <img src="https://picsum.photos/250?2" alt="Product">
        <h3>Smartphone</h3>
        <p class="price">$699</p>
        <div class="rating">⭐⭐⭐⭐</div>
        <button>Buy Now</button>
    </div>

    <div class="product-card">
        <img src="https://picsum.photos/250?3" alt="Product">
        <h3>Headphones</h3>
        <p class="price">$149</p>
        <div class="rating">⭐⭐⭐⭐⭐</div>
        <button>Buy Now</button>
    </div>

    <div class="product-card">
        <img src="https://picsum.photos/250?4" alt="Product">
        <h3>Smart Watch</h3>
        <p class="price">$199</p>
        <div class="rating">⭐⭐⭐⭐</div>
        <button>Buy Now</button>
    </div>

    <div class="product-card">
        <img src="https://picsum.photos/250?5" alt="Product">
        <h3>Camera</h3>
        <p class="price">$599</p>
        <div class="rating">⭐⭐⭐⭐⭐</div>
        <button>Buy Now</button>
    </div>

    <div class="product-card">
        <img src="https://picsum.photos/250?6" alt="Product">
        <h3>Gaming Mouse</h3>
        <p class="price">$79</p>
        <div class="rating">⭐⭐⭐⭐</div>
        <button>Buy Now</button>
    </div>

    <div class="product-card">
        <img src="https://picsum.photos/250?7" alt="Product">
        <h3>Keyboard</h3>
        <p class="price">$99</p>
        <div class="rating">⭐⭐⭐⭐⭐</div>
        <button>Buy Now</button>
    </div>

    <div class="product-card">
        <img src="https://picsum.photos/250?8" alt="Product">

    </div>
</body>
</html>
