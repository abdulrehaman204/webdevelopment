<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
.container{
    display: grid;
    grid-template-columns: 200px 1fr;
    grid-template-rows: 60px 1fr 50px;
    grid-template-areas: 
    "header header"
    "sidebar main"
    "footer footer";
    height: 100vh;
}
header {
    grid-area: header;
    background: #333;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
}

main {
    grid-area: main;
    background: #f4f4f4;
    display: flex;
    justify-content: center;
    align-items: center;
}

aside {
    grid-area: sidebar;
    background: #777;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
}

footer {
    grid-area: footer;
    background: #222;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
}
    </style>
</head>
<body>
     <div class="container">
        <header>Header</header>
        <main>Main</main>
        <aside>Side bar</aside>
        <footer>Footer</footer>
    </div>
</body>
</html>
