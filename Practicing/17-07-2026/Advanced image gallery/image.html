<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=
    , initial-scale=1.0">
    <title>Advanced Image-Gallery</title>
    <style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#111;
    color:#fff;
    padding:40px;
}

h1{
    text-align:center;
    margin-bottom:30px;
    letter-spacing:2px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:18px;
}

.gallery img{
    width:100%;
    height:250px;
    object-fit:cover;
    border-radius:12px;
    cursor:pointer;
    transition:transform .4s ease, box-shadow .4s ease;
}

.gallery img:hover{
    transform:scale(1.08);
    box-shadow:0 10px 25px rgba(255,255,255,.25);
}

</style>
</head>
<body>
    <h1>Advanced Image Gallery</h1>

<div class="gallery">
<img src="https://picsum.photos/id/1015/600/400" alt="">
<img src="https://picsum.photos/id/1025/600/400" alt="">
<img src="https://picsum.photos/id/1035/600/400" alt="">
<img src="https://picsum.photos/id/1043/600/400" alt="">
<img src="https://picsum.photos/id/1050/600/400" alt="">
<img src="https://picsum.photos/id/1069/600/400" alt="">
<img src="https://picsum.photos/id/1074/600/400" alt="">
<img src="https://picsum.photos/id/1084/600/400" alt="">
</div>

</body>
</html>
