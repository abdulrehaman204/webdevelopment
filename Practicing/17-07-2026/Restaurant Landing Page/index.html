<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foodie's Restaurant</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#fafafa;
}

header{
background:#d62828;
color:white;
padding:20px;
text-align:center;
}

nav{
background:#333;
padding:10px;
text-align:center;
}

nav a{
color:white;
text-decoration:none;
margin:15px;
font-weight:bold;
}

nav a:hover{
color:yellow;
}

.banner{
background:url("https://picsum.photos/1200/500?food") center/cover;
height:400px;
display:flex;
justify-content:center;
align-items:center;
color:white;
font-size:40px;
font-weight:bold;
text-shadow:2px 2px 5px black;
}

.menu{
padding:40px;
}

.menu h2{
text-align:center;
margin-bottom:30px;
}

.items{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 5px 10px gray;
text-align:center;
transition:.3s;
}

.card:hover{
transform:scale(1.05);
}

footer{
background:#333;
color:white;
text-align:center;
padding:15px;
margin-top:30px;
}
</style>

</head>
<body>

<header>
<h1>Foodie's Restaurant</h1>
</header>

<nav>
<a href="#">Home</a>
<a href="#">Menu</a>
<a href="#">Gallery</a>
<a href="#">Contact</a>
</nav>

<div class="banner">
Delicious Food Every Day
</div>

<section class="menu">
<h2>Popular Dishes</h2>

<div class="items">

<div class="card">
<h3>Pizza</h3>
<p>Cheesy Italian Pizza</p>
<h4>$10</h4>
</div>

<div class="card">
<h3>Burger</h3>
<p>Fresh Beef Burger</p>
<h4>$8</h4>
</div>

<div class="card">
<h3>Pasta</h3>
<p>Creamy White Sauce Pasta</p>
<h4>$12</h4>
</div>

<div class="card">
<h3>Ice Cream</h3>
<p>Chocolate Delight</p>
<h4>$6</h4>
</div>

</div>
</section>

<footer>
© 2026 Foodie's Restaurant
</footer>

</body>
</html>
