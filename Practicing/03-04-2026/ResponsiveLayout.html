<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            font-weight: bold;
        }
        .container{
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            grid-template-rows: auto 2fr 2fr auto;
            gap: 10px;
            height: 100vh;
            grid-template-areas: 
            "header header header"
            "sidebar content1 content1"
            "sidebar content2 content3"
            "footer footer footer";
        }
        .header{
            grid-area: header;
            background: orange;
            padding: 20px;
        }
        .sidebar{
            grid-area: sidebar;
            background: orangered;
            padding: 2opx;
        }
        .content-1{
            grid-area: content1;
            background: red;
            padding: 20px;
        }
        .content-2{
            grid-area: content2;
            background: violet;
            padding: 20px;
            width: 500px;
        }
        .content-3{
            grid-area: content3;
            background: violet;
            padding: 20px;
            width: 500px;
        }
        .footer{
            grid-area: footer;
            background: yellow;
            padding: 20px;
        }
        .container > * {
            border-radius: 6px;
            text-align: center;
            color: white;
        }
        @media(max-width:768px){
           .container{
            grid-template-columns: 1fr;
            grid-template-areas: 
            "header"
            "sidebar"
            "content1"
            "content2"
            "content3"
            "footer";
           }
        }
    </style>
</head>
<body>
    <div class="container">
     <header class="header">Header</header>
     <aside class="sidebar">Sidebar</aside>
     <main class="content-1">Content 1</main>
     <section class="content-2">Content 2</section>
     <section class="content-3">Content 3</section>
     <footer class="footer">Footer</footer>
    </div>
</body>
</html>
