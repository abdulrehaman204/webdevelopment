<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            place-items: center;
            text-align: center;
        }
        header{
            border: solid black;
            background: lightslategray;
            width: 300px;
            padding: 20px;
        }
          main{
            border: solid black;
            background: lightslategray;
            width: 300px;
            padding: 20px;
        }
          aside{
            border: solid black;
            background: lightslategray;
            width: 300px;
            padding: 20px;
        }
          footer{
            border: solid black;
            background: lightslategray;
            width: 300px;
            padding: 20px;
        }
    </style>
</head>
<body>
   <div class="container">
        <header>Header</header>
        <main>Main</main>
        <aside>Side bar</aside>
        <footer>Footer</footer>
    </div>
</body>
</html>
